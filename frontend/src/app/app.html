@if (hasFatalError()) {
  <app-error-fallback class="app-error-fallback-overlay" />
}

<a class="skip-link" href="#main-content">{{ 'a11y.skip_to_main' | translate }}</a>

<app-i18n-bootstrap-error-banner />

<app-navbar
  [user]="authService.user()"
  [loading]="authService.loading()"
  [sessionUnavailable]="authService.sessionUnavailable()"
  [workLogOverdueCount]="workLogOverdueCount()"
  (logout)="logout()"
  (retrySession)="retrySession()"
/>

<app-offline-banner />
<app-flash-message />

<main id="main-content" class="app-main" tabindex="-1">
  <router-outlet />
</main>

<app-footer />
<app-undo-toast (undo)="performUndo()" />
<app-cookie-consent-banner />
