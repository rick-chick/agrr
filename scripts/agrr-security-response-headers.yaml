# Canonical security response headers for agrr.net (LB backends + agrr-server middleware).
# Values are header-name:header-value strings for gcloud --custom-response-header.
headers:
  - "Strict-Transport-Security:max-age=31536000; includeSubDomains"
  - "X-Content-Type-Options:nosniff"
  - "Referrer-Policy:strict-origin-when-cross-origin"
  - "X-Frame-Options:SAMEORIGIN"
  - "Content-Security-Policy-Report-Only:default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'"
