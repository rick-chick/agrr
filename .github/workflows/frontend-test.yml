# Angular: unit test / build
name: Frontend test

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Route manifest coverage
        run: npm run test:route-manifest-coverage

      - name: Route manifest freshness
        run: npm run e2e:manifest:check

      - name: Layout contract coverage
        run: npm run e2e:layout-contract:check:enforce

      - name: UI composition lint enforce
        run: npm run check:ui-composition:enforce

      - name: check-ui-composition unit tests
        working-directory: frontend
        run: node --test scripts/check-ui-composition.test.mjs

      - name: Visual review pattern freshness
        run: npm run e2e:visual-review:check

      - name: layout smoke lib unit tests
        working-directory: frontend
        run: node --test e2e/smoke/layout-invariants-lib.test.mjs e2e/smoke/layout-smoke-lib.test.mjs e2e/smoke/layout-archetype-layout-lib.test.mjs e2e/smoke/layout-archetype-design-contract-lib.test.mjs e2e/smoke/verify-layout-contract-coverage-lib.test.mjs e2e/smoke/layout-conformance-bindings.test.mjs

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Production build
        run: npm run build

      - name: Prerender output verification
        run: npm run verify:prerender-output

      - name: ng serve proxy contract
        run: npm run check:proxy-conf

      - name: UX findings collector unit tests
        working-directory: ${{ github.workspace }}
        run: node --test .cursor/skills/ux-issue-creator/scripts/collect-ux-findings.test.mjs

      - name: check-hardcoded-i18n unit tests
        working-directory: frontend
        run: node --test scripts/check-hardcoded-i18n.test.mjs

      - name: check-package-deps unit tests
        working-directory: frontend
        run: npm run verify:package-deps

      - name: check-hardcoded-i18n enforce gate
        working-directory: frontend
        run: npm run check-hardcoded-i18n:enforce

      - name: generate-e2e-route-manifest unit tests
        working-directory: frontend
        run: node --test scripts/generate-e2e-route-manifest.test.mjs

      - name: prerender SEO meta unit tests
        working-directory: frontend
        run: |
          node --test scripts/route-seo-meta-lib.test.mjs
          node --test scripts/prerender-seo-meta.test.mjs
          node --test scripts/seo-prerender-expectations.test.mjs

      - name: verify-visual-review-fresh unit tests
        working-directory: frontend
        run: node --test e2e/agent-review/verify-visual-review-fresh.test.mjs e2e/agent-review/agent-review-bundle.test.mjs

      - name: apply-resolved-url unit tests
        working-directory: frontend
        run: node --test e2e/apply-resolved-url.test.mjs

      - name: resolve-capture-urls scope unit tests
        working-directory: frontend
        run: node --test e2e/resolve-capture-urls-scope.test.mjs

      - name: verify-lighthouse-ci-workflow unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-lighthouse-ci-workflow.test.mjs frontend/scripts/lighthouse-auth-route-bundle-boundary.test.mjs

      - name: verify-frontend-test-ci-workflow unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-frontend-test-ci-workflow.test.mjs

      - name: verify-e2e-smoke-ci-workflow unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-e2e-smoke-ci-workflow.test.mjs

      - name: verify-e2e-capture-ci-workflow unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-e2e-capture-ci-workflow.test.mjs

      - name: verify-pr-merge-worker-dispatch-workflow unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-pr-merge-worker-dispatch-workflow.test.mjs

      - name: agrr-mcp unit tests
        working-directory: tools/agrr-mcp
        run: |
          npm ci
          npm test

      - name: agrr-repo-mcp unit tests
        working-directory: tools/agrr-repo-mcp
        run: |
          npm ci
          npm test

      - name: automation script unit tests
        working-directory: ${{ github.workspace }}
        run: |
          node --test scripts/cloud-gh-auth-lib.test.mjs
          node --test scripts/delivery-dispatch-lib.test.mjs
          node --test scripts/delivery-agent-campaign-lib.test.mjs
          node --test scripts/delivery-agent-automation-prompt-lib.test.mjs
          node --test scripts/verify-delivery-webhook-smoke-lib.test.mjs
          node --test scripts/gh-repo-lib.test.mjs
          node --test scripts/pr-agent-prep-lib.test.mjs
          node --test scripts/audit-pr-acceptance-lib.test.mjs
          node --test scripts/db-bootstrap-restore.test.mjs
          node --test scripts/verify-security-response-headers.test.mjs
          node --test scripts/issue-worker-dispatch-lib.test.mjs
          node --test scripts/pr-merge-worker-needs-sync.test.mjs
          node --test scripts/pr-merge-worker-primary-dispatch-lib.test.mjs
          node --test scripts/pr-merge-worker-reconcile-prep-lib.test.mjs
          node --test scripts/pr-merge-worker-dispatch-payload-lib.test.mjs
          node --test scripts/pr-merge-worker-retry-dispatch-lib.test.mjs
          node --test scripts/verify-pr-agent-prep-workflow.test.mjs
          node --test scripts/verify-resolve-pr-merge-conflicts-script.test.mjs
          node --test scripts/verify-issue-worker-dispatch-workflow.test.mjs
          node --test scripts/verify-delivery-agent-cutover-lib.test.mjs
          node --test scripts/verify-product-gap-current-state-lib.test.mjs
          node --test scripts/verify-product-gap-gates-lib.test.mjs
          node --test scripts/product-gap-gates-fail-conditions-lib.test.mjs
          node --test scripts/verify-ruleset-ci-lib.test.mjs
          node --test scripts/webhook-post-lib.test.mjs
          node --test scripts/resolve-workflow-run-pr-lib.test.mjs
          node --test scripts/resolve-workflow-run-pr-from-gh.test.mjs
          node --test scripts/cloud-gh-auth-lib.test.mjs
          node --test scripts/cloud-gh-wrapper.integration.test.mjs
          node --test scripts/cloud-gh-auth.integration.test.mjs

      - name: research simulate CTA unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/research-simulate-cta.test.mjs

      - name: apex HTTP to HTTPS redirect contract unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-apex-http-to-https-redirect.test.mjs

      - name: frontend-deploy SEO routing contract unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-frontend-deploy-seo-routing.test.mjs

      - name: core API optimization SLI-SLO doc contract unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-core-api-optimization-sli-slo-doc-lib.test.mjs

      - name: product-gap phase 1 current-state contract unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-product-gap-phase1-current-state-lib.test.mjs

      - name: prerender shell paths sync contract unit tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-prerender-shell-paths-sync.test.mjs

      - name: verify-seo-routing contract unit tests
        working-directory: ${{ github.workspace }}
        run: node --test .cursor/skills/deploy-frontend/scripts/verify-seo-routing-contract.test.mjs

      - name: deploy shell mirror and SPA canonical contract unit tests
        working-directory: ${{ github.workspace }}
        run: |
          node --test .cursor/skills/deploy-frontend/scripts/gcp-frontend-deploy-shell-mirror-lib.test.mjs
          node --test .cursor/skills/deploy-frontend/scripts/verify-seo-routing-lib.test.mjs

      - name: gcp-frontend-deploy shell paths contract unit tests
        working-directory: ${{ github.workspace }}
        run: node --test .cursor/skills/deploy-frontend/scripts/gcp-frontend-deploy-shell-paths-lib.test.mjs

      - name: verify-seo-canonical helper unit tests
        working-directory: ${{ github.workspace }}
        run: node --test .cursor/skills/deploy-frontend/scripts/verify-seo-canonical-lib.test.mjs

      - name: research vitepress link patch unit tests
        working-directory: ${{ github.workspace }}
        run: |
          node --test .cursor/skills/research-tools/scripts/patch-research-vitepress-links.test.mjs
          node --test .cursor/skills/research-tools/scripts/patch-research-vitepress-en-locale.test.mjs

      - name: research EN translation QA unit tests
        working-directory: ${{ github.workspace }}
        run: |
          node --test scripts/patch-research-vitepress-en-locale-lib.test.mjs
          node --test scripts/bulk-translate-research-en-lib.test.mjs
          node --test scripts/research-major-pests-crop-alignment-lib.test.mjs
          node --test scripts/research-vp-doc-lib.test.mjs
          node --test scripts/verify-research-en-translation-lib.test.mjs
          node --test scripts/inject-research-noindex-lib.test.mjs
          node --test scripts/research-en-translated-crops-lib.test.mjs
          node scripts/verify-research-en-translation.mjs

      - name: research footer brand patch unit tests
        working-directory: ${{ github.workspace }}
        run: node --test .cursor/skills/research-tools/scripts/patch-research-footer-brand.test.mjs

      - name: research base path guard unit tests
        working-directory: ${{ github.workspace }}
        run: node --test .cursor/skills/research-tools/scripts/research-base-path-guard-lib.test.mjs

      - name: research hreflang unit tests
        working-directory: ${{ github.workspace }}
        run: |
          node --test scripts/research-hreflang-lib.test.mjs
          node --test scripts/spa-hreflang-lib.test.mjs
          node --test scripts/research-indexable-html-lib.test.mjs
          node --test scripts/agrr-frontend-url-map-redirects.test.mjs

      - name: research CTA browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:research-cta

      - name: ensure-e2e-baseline bodies unit tests
        working-directory: frontend
        run: node --test e2e/fixtures/ensure-e2e-baseline-bodies.test.mjs

      - name: entry-schedule ids unit tests
        working-directory: frontend
        run: node --test e2e/shared/entry-schedule-ids-lib.test.mjs

      - name: e2e baseline-ids and route-validity lib unit tests
        working-directory: frontend
        run: node --test e2e/shared/baseline-ids-lib.test.mjs e2e/route-validity-lib.test.mjs
