# Frontend lint (Angular ESLint)
name: Lint

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master

jobs:
  run-architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Architecture guard (R0-R10)
        run: ./scripts/run-architecture-guard.sh

      - name: Architecture guard unit tests
        run: node --test scripts/run-architecture-guard-lib.test.mjs

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (ng lint)
        run: npx ng lint
