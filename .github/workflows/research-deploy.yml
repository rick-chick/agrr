name: Research deploy

on:
  push:
    branches:
      - master
    paths:
      - 'public/research/**'
      - 'scripts/research-simulate-cta-lib.mjs'
      - 'scripts/verify-research-cta-production-asset.mjs'
      - 'scripts/verify-research-temperature-cta-lib.mjs'
      - '.cursor/skills/research-tools/**'
  workflow_dispatch:

concurrency:
  group: research-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-deploy-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::GCP_SA_KEY secret is not configured; research deploy cannot run."
              exit 1
            fi
            echo "GCP deploy secrets are not configured; skipping research deploy."
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: check-deploy-secrets
    if: needs.check-deploy-secrets.outputs.configured == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Sync research assets to GCS
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          chmod +x ./.cursor/skills/research-tools/scripts/sync-research-gcs.sh
          ./.cursor/skills/research-tools/scripts/sync-research-gcs.sh

      - name: Verify production CTA asset
        run: node scripts/verify-research-cta-production-asset.mjs
