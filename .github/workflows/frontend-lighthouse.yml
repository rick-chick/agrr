# Lighthouse CI gate for public prerender + mobile public + authenticated SPA routes (lab scores, warn-only thresholds)
name: Frontend Lighthouse CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-lighthouse.yml'
      - 'scripts/run-lighthouse-ci.sh'
      - 'scripts/verify-lighthouse-ci-workflow-lib.mjs'
      - 'docker-compose.yml'
      - 'docker-compose.e2e-ci.yml'
      - 'Dockerfile.agrr-server'
      - 'docker/**'
      - 'crates/agrr-migrate/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/frontend-lighthouse.yml'
      - 'scripts/run-lighthouse-ci.sh'

concurrency:
  group: frontend-lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lighthouse CI workflow contract
        working-directory: ${{ github.workspace }}
        run: node --test scripts/verify-lighthouse-ci-workflow.test.mjs

      - name: Cache E2E dev SQLite
        uses: actions/cache@v4
        with:
          path: .docker/e2e_dev_db_cache
          key: e2e-dev-db-${{ hashFiles('crates/agrr-migrate/migrations/**/*.sql', 'db/fixtures/**') }}
          restore-keys: |
            e2e-dev-db-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Run Lighthouse CI
        working-directory: ${{ github.workspace }}
        env:
          E2E_CI_HEALTH_WAIT_SECS: "240"
        run: bash scripts/run-lighthouse-ci.sh

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-reports
          path: |
            frontend/.lighthouseci/
            frontend/.lighthouseci-mobile-public/
            frontend/.lighthouseci-auth/
          if-no-files-found: ignore

      - name: Log reproduction URLs on threshold warnings
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          echo "Re-run locally: bash scripts/run-lighthouse-ci.sh"
          echo "Reports artifact: lighthouse-ci-reports"
          node -e "
            const routes = require('./frontend/scripts/lighthouse-ci-routes.json');
            for (const r of routes.publicRoutes) console.log('Public URL:', r.path);
            for (const r of routes.authenticatedRoutes) console.log('Auth template:', r.path);
          "
